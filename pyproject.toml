[project]
name = "marketwatch"
version = "0.1.0"
description = "Scan second-hand marketplaces, estimate the market price of a product and flag listings below it."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
marketwatch = "marketwatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
